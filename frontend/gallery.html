<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery · AI Light Canvas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="appShell">
      <header class="topBar">
        <div class="brand">
          <div class="brandTitle">Gallery</div>
          <div class="brandSub">Uploaded photos + optimized matrix versions</div>
        </div>
        <div class="topBarActions">
          <a href="/" class="btn ghost" style="text-decoration:none; display:inline-flex; align-items:center">Back to Simulator</a>
        </div>
      </header>

      <main class="main main--fullwidth">
        <section class="pageSheet">
          <div class="settingsGroup">
            <div class="groupTitle">Upload</div>
            <div class="muted" style="margin-top:6px">Pick a file, optionally name it, then save. Variants generate in the background.</div>

            <div class="fieldGrid2" style="margin-top:10px">
              <label class="field" style="grid-column: 1 / -1">
                <span class="fieldLabel">Optional name</span>
                <input id="inpUploadLabel" type="text" maxlength="120" placeholder="e.g. Portrait line art" autocomplete="off" />
              </label>
              <label class="field">
                <span class="fieldLabel">Crop focus (for square versions)</span>
                <select id="selCropFocus">
                  <option value="center">Center</option>
                  <option value="left">Left</option>
                  <option value="right">Right</option>
                  <option value="top">Top</option>
                  <option value="bottom">Bottom</option>
                </select>
              </label>
              <label class="field">
                <span class="fieldLabel">File</span>
                <input id="fileUpload" type="file" accept="image/*" />
              </label>
            </div>

            <div class="btnRow" style="align-items:center; margin-top:10px">
              <button id="btnUploadSave" class="btn primary" type="button" disabled>Save upload</button>
              <button id="btnUploadClear" class="btn" type="button" disabled>Clear</button>
              <div id="txtUploadPicked" class="muted btnRow-fill uiEllipsis"></div>
            </div>

            <div id="uploadPreviewWrap" class="uploadPreviewWrap" hidden>
              <div class="variantRow" style="margin-top:10px">
                <img id="imgUploadPreview" class="variantCanvas" alt="" decoding="async" />
                <div class="muted" style="align-self:center">Preview</div>
              </div>
            </div>

            <div id="uploadProgressWrap" class="progressWrap" hidden>
              <div class="progressTop">
                <div id="txtUploadProgress" class="muted">Uploading…</div>
                <div id="txtUploadProgressPct" class="muted">0%</div>
              </div>
              <div class="progressTrack">
                <div id="uploadProgressBar" class="progressBar" style="width:0%"></div>
              </div>
            </div>
          </div>

          <div class="settingsGroup" style="margin-top: 10px">
            <div class="groupTitle">Gallery</div>
            <div id="galleryStatus" class="muted">Loading…</div>
          </div>

          <div id="galleryGrid" class="galleryGrid"></div>
        </section>
      </main>
    </div>

    <div id="previewModal" class="modalOverlay" hidden>
      <div class="modalCard" role="dialog" aria-modal="true" aria-label="Matrix preview">
        <div class="modalHeader">
          <div id="previewTitle" class="groupTitle" style="margin:0">Preview</div>
          <button id="btnClosePreview" class="btn ghost" type="button">Close</button>
        </div>
        <div class="modalBody">
          <canvas id="previewCanvas" width="640" height="640" class="modalCanvas"></canvas>
          <img id="previewRaster" class="modalRaster" alt="" hidden decoding="async" />
        </div>
        <div class="modalFooter">
          <div id="previewHint" class="muted">Tip: Copy puts a PNG in your clipboard.</div>
          <div style="flex:1"></div>
          <button id="btnCopyPreview" class="btn primary" type="button">Copy image</button>
        </div>
      </div>
    </div>

    <script src="./gallery.js"></script>
  </body>
</html>
