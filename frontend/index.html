<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Light Canvas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="appShell">
      <header class="topBar">
        <div class="brand">
          <div class="brandTitle">AI Light Canvas</div>
          <div class="brandSub">Ambient generative LED matrix simulator</div>
        </div>

        <div class="topBarActions">
          <button id="btnStart" class="btn primary">Start</button>
          <button id="btnStop" class="btn">Stop</button>
          <a href="/gallery.html" class="btn ghost" style="text-decoration:none; display:inline-flex; align-items:center">Gallery</a>
          <a href="/settings.html" class="btn ghost" style="text-decoration:none; display:inline-flex; align-items:center">Settings</a>
        </div>
      </header>

      <main class="main">
        <section class="canvasPanel">
          <div class="canvasWrap">
            <canvas id="matrixCanvas" width="640" height="640"></canvas>
          </div>
          <div class="statusBar">
            <div class="statusItem">
              <span class="label">Connection</span>
              <span id="statusConnection" class="value">…</span>
            </div>
            <div class="statusItem">
              <span class="label">Run</span>
              <span id="statusRunning" class="value">—</span>
            </div>
            <div class="statusItem">
              <span class="label">Output</span>
              <span id="statusOutput" class="value">simulator</span>
            </div>
            <div class="statusItem">
              <span class="label">Matrix</span>
              <span id="statusMatrix" class="value">—</span>
            </div>
            <div class="statusItem">
              <span class="label">FPS</span>
              <span id="statusFps" class="value">—</span>
            </div>
            <div class="statusItem">
              <span class="label">Pattern</span>
              <span id="statusPattern" class="value">—</span>
            </div>
            <div class="statusItem">
              <span class="label">Frame</span>
              <span id="statusSeq" class="value">—</span>
            </div>
          </div>
        </section>

        <aside class="playPanel">
          <div class="settingsGroup">
            <div class="groupTitle">Now playing</div>
            <div class="muted" style="margin-top:6px">Pick what to show. Tuning + speeds live in Settings.</div>

            <div class="muted" style="margin-top:10px">
              <span class="label" style="display:block; font-size:11px; color: var(--muted);">Current</span>
              <span id="txtNowPlaying" class="value" style="display:block; font-size:13px; margin-top:4px">—</span>
            </div>

            <label class="field" style="margin-top:12px">
              <span class="fieldLabel">Display</span>
              <select id="selPattern"></select>
            </label>

            <label class="field" style="margin-top:12px">
              <span class="fieldLabel">Matrix</span>
              <select id="selMatrixPreset">
                <option value="8x8">8 × 8</option>
                <option value="16x16">16 × 16</option>
                <option value="32x32">32 × 32</option>
                <option value="64x64">64 × 64</option>
                <option value="64x96">64 × 96</option>
                <option value="64x128">64 × 128</option>
                <option value="128x64">128 × 64</option>
                <option value="128x128">128 × 128</option>
              </select>
            </label>

            <div id="photoControls" class="settingsGroup" style="margin-top:12px; display:none">
              <div class="groupTitle">Photo</div>
              <label class="field">
                <span class="fieldLabel">Upload (optional name)</span>
                <input id="inpUploadLabel" type="text" maxlength="120" placeholder="e.g. Face line art" autocomplete="off" />
              </label>
              <label class="field">
                <span class="fieldLabel">Crop focus (for square versions)</span>
                <select id="selCropFocus">
                  <option value="center">Center</option>
                  <option value="left">Left</option>
                  <option value="right">Right</option>
                  <option value="top">Top</option>
                  <option value="bottom">Bottom</option>
                </select>
              </label>
              <label class="field">
                <span class="fieldLabel">File</span>
                <input id="fileUpload" type="file" accept="image/*" />
              </label>
              <div class="btnRow" style="align-items:center; margin-top:10px">
                <button id="btnUploadSave" class="btn primary" type="button" disabled>Save upload</button>
                <button id="btnUploadClear" class="btn" type="button" disabled>Clear</button>
                <div id="txtUploadPicked" class="muted" style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap"></div>
              </div>
              <div id="uploadProgressWrap" class="progressWrap" hidden>
                <div class="progressTop">
                  <div id="txtUploadProgress" class="muted">Uploading…</div>
                  <div id="txtUploadProgressPct" class="muted">0%</div>
                </div>
                <div class="progressTrack">
                  <div id="uploadProgressBar" class="progressBar" style="width:0%"></div>
                </div>
              </div>
              <label class="field">
                <span class="fieldLabel">Library</span>
                <select id="selDrawing"></select>
              </label>
              <div class="btnRow">
                <button id="btnUseLivingDrawing" class="btn primary" type="button">Show selected photo</button>
              </div>
              <div id="photoPatternHint" class="patternHint" aria-live="polite"></div>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
